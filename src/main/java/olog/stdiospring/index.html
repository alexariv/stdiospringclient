<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MCP LLM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; }
    textarea, button { width: 100%; font-size: 1rem; }
    textarea { height: 8rem; }
    .row { margin-bottom: 1rem; }
    .out { white-space: pre-wrap; border: 1px solid #ccc; padding: .75rem; border-radius: .5rem; min-height: 6rem; }
  </style>
</head>
<body>
  <h1>Prompt</h1>

  <div class="row">
    <textarea id="prompt" placeholder="Enter prompt"></textarea>
  </div>

  <div class="row">
    <button id="send" type="button">Send (Ctrl+Enter)</button>
  </div>

  <h2>Reply</h2>
  <div id="reply" class="out"></div>

  <script>
    const promptEl = document.getElementById('prompt');
    const replyEl  = document.getElementById('reply');
    const btn      = document.getElementById('send');

    async function send() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      btn.disabled = true;
      replyEl.textContent = 'Loading...';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch {}
        replyEl.textContent = (data && typeof data.reply !== 'undefined')
          ? data.reply
          : text;
      } catch (err) {
        replyEl.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', send);
    // Ctrl+Enter shortcut
    promptEl.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') send();
    });
  </script>
</body>
</html>
